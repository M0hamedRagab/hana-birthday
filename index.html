:root{
  --bg:#f5f4ef; --ink:#14181f; --soft:#4a5260; --line:#d9d6cc; --accent:#b4432f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1319; --ink:#f1efe8; --soft:#aab2bf; --line:#2a313c; --accent:#e5806a}}
:root[data-theme="dark"]{--bg:#0f1319; --ink:#f1efe8; --soft:#aab2bf; --line:#2a313c; --accent:#e5806a}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.7 "Sora",system-ui,sans-serif;display:grid;place-items:center;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;opacity:.45;
  -webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 45%,#000,transparent 75%);mask-image:radial-gradient(ellipse 60% 55% at 50% 45%,#000,transparent 75%)}
main{position:relative;z-index:1;width:100%;max-width:560px;padding:2rem 1.5rem;text-align:center}
.lock{position:relative;width:64px;height:64px;margin:1.6rem auto 2.4rem;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:.55rem;font-size:.72rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);
  border:1px solid var(--line);border-radius:999px;padding:.4rem .95rem}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.code{font-weight:200;font-size:clamp(7rem,32vw,12.5rem);line-height:1;letter-spacing:-.05em;margin:.5rem 0 .2rem;
  background:linear-gradient(180deg,var(--ink) 25%,transparent 105%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(1.35rem,5vw,1.75rem);font-weight:600;letter-spacing:-.01em;margin:0 0 .8rem}
p{margin:0 auto;max-width:34ch;color:var(--soft)}
.meta{margin-top:1.8rem;padding-top:1.3rem;border-top:1px solid var(--line);font:400 .74rem/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;color:var(--soft)}
.lock::before{content:"";position:absolute;inset:-13px;border:1px dashed var(--soft);border-radius:50%;opacity:.5;animation:spin 48s linear infinite}
.lock::after{content:"";position:absolute;inset:-28px;border:1px solid var(--line);border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;opacity:.3;animation:drift 20s ease-in-out infinite}
.orb.a{width:340px;height:340px;left:-90px;top:-70px;background:var(--accent)}
.orb.b{width:300px;height:300px;right:-100px;bottom:-80px;background:#c9a15b;animation-delay:-10s}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(44px,32px)}}
.frame{position:fixed;inset:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.frame i{position:absolute;width:22px;height:22px;border:1.5px solid var(--soft);opacity:.55}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.sig{margin-top:2.4rem;display:flex;align-items:center;justify-content:center;gap:1rem}
.sig::before,.sig::after{content:"";width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--accent))}
.sig::after{transform:scaleX(-1)}
.sig b{font:600 1.25rem/1.2 "Sora",system-ui,sans-serif;letter-spacing:.06em;color:var(--ink)}
.shapes{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.sh{position:absolute;opacity:.5;animation:fl var(--d,16s) ease-in-out infinite;animation-delay:var(--l,0s)}
@keyframes fl{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--x,28px),var(--y,-38px)) rotate(var(--r,90deg))}}
.sh.ring{border:1.5px solid var(--accent);border-radius:50%}
.sh.sq{border:1.5px solid var(--soft);border-radius:4px}
.sh.dt{border-radius:50%;background:var(--accent)}
.sh.dt.g{background:#c9a15b}
.sh.tri{background:#c9a15b;clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.35}
.sh.plus::before,.sh.plus::after{content:"";position:absolute;left:0;top:50%;width:100%;height:1.5px;margin-top:-.75px;background:var(--soft)}
.sh.plus::after{transform:rotate(90deg)}
.in{opacity:0;animation:in .9s ease forwards}
.in:nth-child(2){animation-delay:.12s}.in:nth-child(3){animation-delay:.24s}.in:nth-child(4){animation-delay:.36s}.in:nth-child(5){animation-delay:.48s}.in:nth-child(6){animation-delay:.6s}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}}
</style>
</head>
